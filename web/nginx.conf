# Serves the built Angular app and forwards API + WebSocket traffic to the backend,
# so the browser only ever talks to one origin (no CORS, no API URL to configure).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # REST API: /api/venues -> http://api:3000/venues
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.io, including the WebSocket upgrade. Long timeout: TV screens stay connected all day.
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Hashed build files never change: cache them for a year.
  location ~* \.(?:js|css|woff2|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/staff, /display/:id, ...) all load index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
