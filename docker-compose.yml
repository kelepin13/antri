# Antri: full stack.
#   docker compose up --build
# Web dashboard:  http://localhost:8080   (admin@antri.dev / staff.clinic@antri.dev, password123)
# API + Swagger:  http://localhost:3000/docs

x-backend: &backend
  build: ./backend
  image: antri-backend:local
  init: true
  restart: unless-stopped
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://antri:${POSTGRES_PASSWORD:-antri}@postgres:5432/antri
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    NO_SHOW_AFTER_MINUTES: ${NO_SHOW_AFTER_MINUTES:-10}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: antri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antri}
      POSTGRES_DB: antri
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antri -d antri"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    # Migrations take an advisory lock, so several API replicas can start at once safely.
    command: >
      sh -c "node dist/db/migrate.js &&
             if [ \"$${SEED_DEMO_DATA:-true}\" = \"true\" ]; then node dist/db/seed.js; fi &&
             exec node dist/main.js"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://antri:${POSTGRES_PASSWORD:-antri}@postgres:5432/antri
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    # Waits for the API so migrations have run before jobs start.
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    image: antri-web:local
    restart: unless-stopped
    # nginx serves the dashboard and forwards /api and /socket.io to the api service.
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
